<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Command bar</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="cmd.css">
</head>
<body>
<div id="backdrop">
  <div id="panel" role="dialog" aria-modal="true" aria-label="Command bar">
    <div id="bar">
      <span class="mode" id="mode">Current tab</span>
      <input id="input" type="text" role="combobox" spellcheck="false" autocomplete="off" aria-label="Command or address" aria-autocomplete="list" aria-controls="list" aria-expanded="false" placeholder="URL, search, gh, npm, mdn, env, boost, JWT, Unix time">
    </div>
    <div id="message" class="empty"></div>
    <div id="list" role="listbox" aria-label="Suggestions" hidden></div>
    <div id="preview" hidden>
      <strong id="action"></strong>
      <span id="destination" dir="auto"></span>
      <span id="context"></span>
    </div>
    <div id="announcement" class="sr-only" role="status" aria-atomic="true"></div>
    <div id="foot">
      <span><code>↑↓</code> select</span><span id="enter" hidden><code>Enter</code> confirm</span><span id="alternate" hidden><code>Alt+Enter</code> new tab</span><span><code>Esc</code> return to where you were</span>
    </div>
  </div>
</div>
<script type="module" src="commandbar.js"></script>
</body>
</html>
