name: Windows beta verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 beta
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Compile and test
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Extract the pinned PortableApps.com compiler
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PortableApps.comInstaller_3.9.24.paf.exe'
          $tools = Join-Path $env:RUNNER_TEMP 'quiver-paf-tools'
          $path = 'project/portableapps/PortableApps.com%20Installer/PortableApps.comInstaller_3.9.24.paf.exe'
          $urls = @(
            "https://downloads.sourceforge.net/$path",
            "https://pilotfiber.dl.sourceforge.net/${path}?viasf=1",
            "https://psychz.dl.sourceforge.net/${path}?viasf=1"
          )
          $expected = '7EF6E2758CB578843D767FB5FAFDBDE8BF872B84F0ACD6E64F18AFBB05C04F00'
          $verified = $false
          foreach ($url in $urls) {
            & curl.exe --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 60 --output $archive $url
            if ($LASTEXITCODE -eq 0) {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
              if ($hash -ceq $expected) {
                $verified = $true
                break
              }
              Write-Warning "PortableApps.com mirror returned a different SHA-256: $hash"
            }
          }
          if (!$verified) { throw 'No PortableApps.com mirror returned the pinned archive.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $archive
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -cne 'DF99B68F457C981B0FDF83731DE299A26B64CCF7') {
            throw 'Unexpected PortableApps.com compiler publisher.'
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $sevenZip x -tNsis -y "-o$tools" $archive 'PortableApps.comInstaller.exe' 'App\*' 'Other\Source\License.txt'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build unsigned Windows setup
        run: npm run build:win -- --config.win.signExecutable=false --config.nsis.differentialPackage=false --publish never

      - name: Verify packaged Electron fuses
        id: payload
        run: |
          $exe = 'release/win-unpacked/Quiver.exe'
          node scripts/verify-electron-fuses.mjs $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          $asarHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'release/win-unpacked/resources/app.asar').Hash
          "exe-sha256=$exeHash" >> $env:GITHUB_OUTPUT
          "asar-sha256=$asarHash" >> $env:GITHUB_OUTPUT

      - name: Build synthetic upgrade fixture
        run: |
          & ./node_modules/.bin/electron-builder.cmd --win nsis --x64 --config.extraMetadata.version=0.0.9 --config.directories.output=release/upgrade-fixture --config.compression=store --config.nsis.differentialPackage=false --config.win.signExecutable=false --publish never

      - name: Verify Windows setup and browser integration
        env:
          QUIVER_EXE_SHA256: ${{ steps.payload.outputs.exe-sha256 }}
          QUIVER_ASAR_SHA256: ${{ steps.payload.outputs.asar-sha256 }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "release/Quiver-v$version-x64-Setup.exe"
          $fixture = 'release/upgrade-fixture/Quiver-v0.0.9-x64-Setup.exe'
          ./scripts/Test-WindowsInstaller.ps1 -Candidate $setup -Fixture $fixture -CandidateVersion $version -CandidateAsarSha256 $env:QUIVER_ASAR_SHA256 -CandidateExeSha256 $env:QUIVER_EXE_SHA256
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build the offline PortableApps installer
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'quiver-paf-tools'
          ./scripts/Build-PortableApps.ps1 -InstallerRoot $tools -UnpackedDirectory release/win-unpacked -OutputDirectory release/portableapps-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify the PortableApps installer and hash the release assets
        id: packages
        shell: pwsh -STA -NoProfile -Command . '{0}'
        env:
          QUIVER_EXE_SHA256: ${{ steps.payload.outputs.exe-sha256 }}
          QUIVER_ASAR_SHA256: ${{ steps.payload.outputs.asar-sha256 }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "release/Quiver-v$version-x64-Setup.exe"
          $portable = "release/portableapps-build/QuiverPortable_${version}_English.paf.exe"
          $previousVersion = if ($version -ceq '0.1.0') { '0.1.0-beta.3' } else { '0.1.0-beta.2' }
          $previousName = "QuiverPortable_${previousVersion}_English.paf.exe"
          $previous = Join-Path $env:RUNNER_TEMP $previousName
          $previousUrl = "https://github.com/SeanShaffer88/Quiver-Browser/releases/download/v$previousVersion/$previousName"
          & curl.exe --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 120 --retry 2 --output $previous $previousUrl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/Test-PortableApps.ps1 -Installer $portable -AsarSha256 $env:QUIVER_ASAR_SHA256 -ExeSha256 $env:QUIVER_EXE_SHA256 -PreviousInstaller $previous
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 -LiteralPath $setup, $portable | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path)
          } | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: quiver-portable-runtime-evidence
          path: ${{ runner.temp }}/quiver-portable-runtime-evidence.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quiver-windows-x64
          path: |
            release/Quiver-v${{ steps.packages.outputs.version }}-x64-Setup.exe
            release/portableapps-build/QuiverPortable_${{ steps.packages.outputs.version }}_English.paf.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
