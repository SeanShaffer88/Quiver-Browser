name: Windows crafted interactions

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/quiver-crafted-interactions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-bar:
    name: Windows x64 command bar
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Exercise command previews and focus with Windows keyboard input
        run: pwsh -NoProfile -STA -File scripts/verification/Test-CraftCommand.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: quiver-command-bar-evidence
          path: ${{ runner.temp }}/quiver-craft-command/*.json
          if-no-files-found: warn
          retention-days: 7

  bookmarks:
    name: Windows x64 bookmark import
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Review, confirm, and undo bookmark imports on Windows
        run: pwsh -NoProfile -STA -File scripts/verification/Test-CraftBookmarks.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: quiver-bookmark-import-evidence
          path: ${{ runner.temp }}/quiver-craft-bookmarks/bookmark-evidence.json
          if-no-files-found: warn
          retention-days: 7
